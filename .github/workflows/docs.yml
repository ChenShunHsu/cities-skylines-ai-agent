name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check docs links
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-doc-links.ps1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          check-latest: true

      - name: Test mayor tools and assessment offline
        env:
          PYTHONIOENCODING: utf-8
          # no game runs on CI: a test that reaches for the Bridge gets a refused port at once
          CS1_AGENT_BASE_URL: http://127.0.0.1:9
          LOCAL_BRIDGE_URL: http://127.0.0.1:9
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # always the newest 24.x: 24.22.1+ carries the 2026-10-21 security fixes
          check-latest: true

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build docs
        working-directory: docs
        run: npm run build
